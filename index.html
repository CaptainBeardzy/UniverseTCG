<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>WWE Chaos Packs – Universe Mode</title>
<style>
:root {
  --bg-deep: #05050a;
  --bg-panel: #12121e;
  --accent: #e8c84a;
  --text-dim: #9494b8;
  --face: #4a8af4;
  --heel: #f44a4a;
  --promo: #a888ff;
  --glass: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.1);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body { 
  background: var(--bg-deep); 
  color:#fff; 
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
  height: 100vh;
  width: 100vw;
  overflow: hidden; /* App style: prevent document scroll */
}

/* --- HUD Layout --- */
#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 70px;
  background: rgba(10, 10, 20, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  justify-content: space-between;
  z-index: 1100;
}

.resource-group { display: flex; gap: 8px; }

.pill {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 55px;
}

.pill .label { font-size: 8px; text-transform: uppercase; color: var(--text-dim); font-weight: 800; letter-spacing: 0.5px; }
.pill .val { font-size: 14px; font-weight: 800; }
.pill.heat .val { color: var(--heel); }
.pill.hype .val { color: #fa0; }
.pill.clout .val { color: var(--promo); }

.stats-group { text-align: right; }
.stats-group .show-tag { color: var(--accent); font-weight: 900; font-size: 12px; font-style: italic; }
.stats-group .pack-count { font-size: 10px; color: var(--text-dim); }

/* --- Navigation Bar (Mobile Native Style) --- */
#nav-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 65px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1100;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  background: none; border: none;
}

.nav-item.active { color: var(--accent); }
.nav-item span.icon { font-size: 20px; margin-bottom: 2px; }

/* --- Main Viewport --- */
#app-viewport {
  position: absolute;
  top: 70px; bottom: 65px;
  left: 0; right: 0;
  overflow-y: auto;
  padding: 16px;
  scroll-behavior: smooth;
}

.view-section { display: none; width: 100%; max-width: 800px; margin: 0 auto; opacity: 0; transform: translateY(10px); transition: 0.3s; }
.view-section.active { display: block; opacity: 1; transform: translateY(0); }

h2.view-title { font-size: 18px; margin-bottom: 20px; text-align: center; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }

/* --- Pack & Reveal UI --- */
.pack-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

.pack-card {
  background: linear-gradient(135deg, #1e1e30, #12121e);
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 20px 10px;
  text-align: center;
  transition: 0.2s;
}
.pack-card:active { transform: scale(0.95); opacity: 0.8; }

/* REVEAL AREA */
#reveal-deck { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center; 
  min-height: 60vh;
}
#cards-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }

/* --- CARD DESIGN 2.0 (Mobile Ready) --- */
.card { width: 100px; height: 160px; perspective: 1000px; }
@media (min-width: 600px) { .card { width: 140px; height: 230px; } }

.card-inner { 
  width: 100%; height: 100%; 
  position: relative; 
  transform-style: preserve-3d; 
  transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  border-radius: 12px; 
}
.card.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back { 
  position: absolute; inset: 0; 
  backface-visibility: hidden; 
  border-radius: 12px; 
  border: 1px solid var(--border);
  overflow: hidden;
}

.card-front {
  background: radial-gradient(circle at 50% 50%, #2a2a4a, #0a0a1a);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}

.card-back {
  transform: rotateY(180deg);
  background: #111;
  display: flex; flex-direction: column; padding: 6px;
  font-size: 10px;
}
.card-back.heel { border-top: 4px solid var(--heel); }
.card-back.face { border-top: 4px solid var(--face); }
.card-back.promo { border-top: 4px solid var(--promo); }

.card-title { font-weight: 800; font-size: 11px; margin-bottom: 4px; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
.card-desc { font-size: 9px; color: var(--text-dim); flex-grow: 1; }
.card-costs { font-weight: 700; color: #fff; font-size: 8px; margin-top: 4px; }

/* --- TRANSITION SCREEN --- */
.transition-wrap { text-align: center; padding-top: 40px; }
.spinner { width: 50px; height: 50px; border: 4px solid var(--glass); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s infinite linear; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* --- BUTTONS --- */
.btn-primary {
  width: 100%;
  background: var(--accent);
  color: #000;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  margin-top: 20px;
}
.btn-primary:disabled { background: var(--text-dim); opacity: 0.5; }

/* --- OVERLAY SCREENS --- */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 2000;
  display: none;
  flex-direction: column;
  padding: 20px;
  padding-bottom: env(safe-area-inset-bottom);
}
.overlay.active { display: flex; }
.overlay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.scroll-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; overflow-y: auto; flex-grow: 1; padding-bottom: 100px; }

/* --- DESKTOP TWEAKS --- */
@media (min-width: 1024px) {
  #app-viewport { padding: 40px; }
  .view-section { max-width: 1200px; }
}
</style>
</head>
<body>

<!-- HUD -->
<header id="hud">
  <div class="resource-group">
    <div class="pill heat"><span class="label">Heat</span><span class="val" id="res-heat">0</span></div>
    <div class="pill hype"><span class="label">Hype</span><span class="val" id="res-hype">0</span></div>
    <div class="pill clout"><span class="label">Clout</span><span class="val" id="res-clout">0</span></div>
  </div>
  <div class="stats-group">
    <div class="show-tag" id="show-tag">SHOW #1</div>
    <div class="pack-count">📦 <span id="packs-count">1</span> Pack</div>
  </div>
</header>

<!-- MAIN VIEWPORT -->
<main id="app-viewport">

  <!-- Pack View -->
  <section id="view-packs" class="view-section active">
    <h2 class="view-title">Recruit Talent</h2>
    <div class="pack-grid" id="pack-list">
      <!-- Loaded dynamically -->
    </div>
    <div id="no-packs" style="display:none; text-align:center; padding: 20px; color: var(--heel);">
      Need more Packs. Advance to next show.
    </div>
  </section>

  <!-- Reveal View -->
  <section id="view-reveal" class="view-section">
    <h2 class="view-title" id="pack-opening-name">Unboxing</h2>
    <div id="reveal-deck">
      <div id="cards-row"></div>
      <p style="font-size:12px; color:var(--text-dim)">Tap each card to flip</p>
      <button id="add-to-hand-btn" class="btn-primary" style="display:none" onclick="addCardsToHand()">Collect Talent</button>
    </div>
  </section>

  <!-- Transition View -->
  <section id="view-transition" class="view-section">
    <div class="transition-wrap">
      <div class="spinner"></div>
      <h2 id="trans-title">Prep Next Show...</h2>
      <p id="trans-msg" style="color:var(--text-dim)">Calculating momentum...</p>
      <div id="transition-cards-area" style="display:flex; gap:10px; overflow-x:auto; padding:20px 0;"></div>
      <button id="finish-trans-btn" class="btn-primary" style="display:none" onclick="finishTransition()">Go Live!</button>
    </div>
  </section>

</main>

<!-- BOTTOM NAVIGATION -->
<nav id="nav-bar">
  <button class="nav-item active" onclick="switchView('view-packs', this)">
    <span class="icon">📦</span><span>Store</span>
  </button>
  <button class="nav-item" onclick="showOverlay('hand-overlay')">
    <span class="icon">🃏</span><span>Hand (<span id="hand-badge">0</span>)</span>
  </button>
  <button class="nav-item" onclick="showOverlay('active-overlay')">
    <span class="icon">🟢</span><span>Active (<span id="active-badge">0</span>)</span>
  </button>
  <button class="nav-item" onclick="goToNextShow()">
    <span class="icon">➡</span><span>Next Show</span>
  </button>
</nav>

<!-- HAND OVERLAY -->
<div id="hand-overlay" class="overlay">
  <div class="overlay-header">
    <h3>Backstage Hand</h3>
    <button onclick="hideOverlay('hand-overlay')" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
  </div>
  <div id="play-status-msg" style="font-size:11px; color:var(--accent); text-align:center; margin-bottom:10px;"></div>
  <div class="scroll-grid" id="hand-grid-overlay"></div>
  
  <div id="hand-actions" style="position:fixed; bottom:0; left:0; right:0; padding:15px; background:var(--bg-panel); display:none; gap:10px;">
    <button id="play-btn" class="btn-primary" style="margin:0; flex:1;" onclick="playSelectedCard()">Play</button>
    <button id="discard-btn" class="btn-primary" style="margin:0; flex:1; background:var(--heel);" onclick="discardSelectedCard()">Discard</button>
  </div>
</div>

<!-- ACTIVE OVERLAY -->
<div id="active-overlay" class="overlay">
  <div class="overlay-header">
    <h3>Active Cards</h3>
    <button onclick="hideOverlay('active-overlay')" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
  </div>
  <div class="scroll-grid" id="active-grid-overlay"></div>
</div>

<script>
// --- GAME STATE ---
let cardData = [];
let resources = { heat: 5, hype: 5, clout: 5 };
let packs = 1;
let showNumber = 1;
let hand = [];
let activeCards = [];
let drawnCards = [];
let flippedCount = 0;
let promoResolved = 0;
let selectedHandItem = null;
const HAND_LIMIT = 5;

// --- UTILS ---
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function updateHUD() {
  document.getElementById('res-heat').textContent = resources.heat;
  document.getElementById('res-hype').textContent = resources.hype;
  document.getElementById('res-clout').textContent = resources.clout;
  document.getElementById('packs-count').textContent = packs;
  document.getElementById('show-tag').textContent = `SHOW #${showNumber}`;
  document.getElementById('hand-badge').textContent = hand.length;
  document.getElementById('active-badge').textContent = activeCards.length;
}

function applyResource(type, amount) {
  resources[type] = Math.max(0, resources[type] + amount);
  updateHUD();
}

// --- NAVIGATION ---
function switchView(viewId, btn) {
  document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  
  document.getElementById(viewId).classList.add('active');
  if(btn) btn.classList.add('active');
}

function showOverlay(id) {
  document.getElementById(id).classList.add('active');
  if(id === 'hand-overlay') renderHand();
  if(id === 'active-overlay') renderActive();
}

function hideOverlay(id) {
  document.getElementById(id).classList.remove('active');
}

// --- LOADER ---
async function loadCards() {
  try {
    const res = await fetch('packs.json');
    const index = await res.json();
    const packPromises = index.packs.map(p => fetch(p).then(r => r.json()));
    cardData = await Promise.all(packPromises);
    renderPacks();
  } catch (e) { console.error("Load fail", e); }
}

function renderPacks() {
  const list = document.getElementById('pack-list');
  list.innerHTML = '';
  cardData.forEach((pack, i) => {
    const el = document.createElement('div');
    el.className = 'pack-card';
    el.innerHTML = `
      <div style="font-size:32px">${pack.icon || '📦'}</div>
      <div style="font-weight:800; margin-top:10px">${pack.name}</div>
    `;
    el.onclick = () => openPack(i);
    list.appendChild(el);
  });
}

// --- PACK OPENING ---
function openPack(idx) {
  if (packs <= 0) return alert("Earn more packs by continuing to the next show!");
  
  // Guard for immediate heels
  if (hand.some(h => (h.card.use === 'Immediately' || h.card.use === 'Immediate') && h.card.cardType === 'heel')) {
    return alert("Play your forced Heel cards first!");
  }

  packs--;
  const pack = cardData[idx];
  drawnCards = drawFixedSet(pack);
  flippedCount = 0; promoResolved = 0;
  
  document.getElementById('pack-opening-name').textContent = pack.name;
  const row = document.getElementById('cards-row');
  row.innerHTML = '';
  
  drawnCards.forEach(card => {
    const el = buildCard(card);
    el.onclick = () => flipCard(el, card);
    row.appendChild(el);
  });
  
  switchView('view-reveal');
  updateHUD();
}

function drawFixedSet(pack) {
  const get = t => {
    let pool = pack.cards.filter(c => c.cardType === t);
    return pool[Math.floor(Math.random() * pool.length)];
  };
  return [get('heel'), get('face'), get('promo')].sort(() => Math.random() - 0.5);
}

function flipCard(el, card) {
  if (el.classList.contains('flipped')) return;
  el.classList.add('flipped');
  flippedCount++;
  
  if (card.cardType === 'promo') {
    handlePromo(el, card);
  } else {
    checkCollectionEligibility();
  }
}

function handlePromo(el, card) {
  const btn = document.createElement('button');
  btn.className = 'btn-primary';
  btn.style.width = '80px'; btn.style.padding = '8px'; btn.style.fontSize = '10px';
  btn.textContent = 'Cash In';
  btn.onclick = (e) => {
    e.stopPropagation();
    if(card.grants) Object.entries(card.grants).forEach(([r,v]) => applyResource(r, v));
    promoResolved++;
    el.style.opacity = '0.3';
    btn.remove();
    checkCollectionEligibility();
  };
  el.appendChild(btn);
}

function checkCollectionEligibility() {
  if (flippedCount >= 3 && promoResolved >= drawnCards.filter(c=>c.cardType==='promo').length) {
    document.getElementById('add-to-hand-btn').style.display = 'block';
  }
}

function addCardsToHand() {
  drawnCards.forEach(c => {
    if(c.cardType !== 'promo') {
      hand.push({ card: c, useWindow: c.use?.includes('within') ? parseInt(c.use.match(/\d+/)[0]) : null });
    }
  });
  drawnCards = [];
  document.getElementById('add-to-hand-btn').style.display = 'none';
  switchView('view-packs');
  updateHUD();
}

// --- HAND MANAGEMENT ---
function renderHand() {
  const grid = document.getElementById('hand-grid-overlay');
  grid.innerHTML = '';
  selectedHandItem = null;
  document.getElementById('hand-actions').style.display = 'none';
  
  const status = document.getElementById('play-status-msg');
  const size = hand.filter(h => !(h.card.cardType==='heel' && h.card.use.includes('Immed'))).length;
  status.textContent = `Slots: ${size}/${HAND_LIMIT}`;

  hand.forEach(h => {
    const el = buildCard(h.card);
    el.classList.add('flipped');
    el.onclick = () => selectCard(el, h);
    grid.appendChild(el);
  });
}

function selectCard(el, h) {
  document.querySelectorAll('#hand-grid-overlay .card').forEach(c => c.style.boxShadow = 'none');
  el.style.boxShadow = `0 0 15px ${varColor(h.card.cardType)}`;
  selectedHandItem = h;
  
  const actions = document.getElementById('hand-actions');
  actions.style.display = 'flex';
  
  const canPlay = canAfford(h.card);
  document.getElementById('play-btn').disabled = !canPlay;
}

function playSelectedCard() {
  const h = selectedHandItem;
  if(!canAfford(h.card)) return;
  
  // Spend
  Object.entries(h.card.cost || {}).forEach(([r,v]) => applyResource(r, -v));
  
  // Active vs Discard
  const dur = h.card.duration === 'Permanent' ? null : (parseInt(h.card.duration) || 0);
  if (dur !== 0 || h.card.duration === 'Permanent') {
    activeCards.push({ card: h.card, duration: dur });
  }
  
  hand = hand.filter(i => i !== h);
  renderHand();
  updateHUD();
}

function discardSelectedCard() {
  hand = hand.filter(i => i !== selectedHandItem);
  renderHand();
  updateHUD();
}

// --- HELPERS ---
function canAfford(card) {
  return Object.entries(card.cost || {}).every(([r,v]) => resources[r] >= v);
}

function varColor(type) {
  if(type === 'heel') return 'var(--heel)';
  if(type === 'face') return 'var(--face)';
  return 'var(--promo)';
}

function buildCard(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="card-inner">
      <div class="card-front">?</div>
      <div class="card-back ${card.cardType}">
        <div class="card-title">${card.title}</div>
        <div class="card-desc">${card.desc}</div>
        <div class="card-costs">${formatCost(card)}</div>
        <div style="font-size:7px; margin-top:2px; opacity:0.6">${card.use || ''}</div>
      </div>
    </div>
  `;
  return el;
}

function formatCost(c) {
  if (c.cardType === 'promo') return 'Gives Resource';
  return Object.entries(c.cost || {}).map(([r,v]) => `${v}${r[0].toUpperCase()}`).join(' ');
}

// --- TRANSITION ---
async function goToNextShow() {
  // Capacity check
  const size = hand.filter(h => !(h.card.cardType==='heel' && h.card.use.includes('Immed'))).length;
  if(size > HAND_LIMIT) return alert("Hand too full! Discard something.");
  if(hand.some(h => h.card.cardType==='heel' && h.card.use.includes('Immed'))) return alert("Resolve immediate heels!");

  switchView('view-transition');
  document.getElementById('trans-title').textContent = `Advancing to Show #${showNumber + 1}`;
  
  await sleep(1000);
  
  // Tick Durations
  activeCards.forEach(ac => { if(ac.duration !== null) ac.duration--; });
  activeCards = activeCards.filter(ac => ac.duration === null || ac.duration > 0);
  
  // Tick Window
  hand.forEach(h => { if(h.useWindow !== null) h.useWindow--; });
  hand.forEach(h => {
    if(h.useWindow === 0 && h.card.cardType === 'heel') h.card.use = 'Immediately';
  });
  hand = hand.filter(h => h.useWindow === null || h.useWindow > 0 || h.card.use === 'Immediately');

  document.getElementById('trans-msg').textContent = "Packs refilled. Show list updated.";
  document.getElementById('finish-trans-btn').style.display = 'block';
}

function finishTransition() {
  showNumber++;
  packs++;
  updateHUD();
  document.getElementById('finish-trans-btn').style.display = 'none';
  switchView('view-packs');
}

function renderActive() {
  const grid = document.getElementById('active-grid-overlay');
  grid.innerHTML = '';
  activeCards.forEach(ac => {
    const el = buildCard(ac.card);
    el.classList.add('flipped');
    const badge = document.createElement('div');
    badge.style.position='absolute'; badge.style.bottom='5px'; badge.style.right='5px';
    badge.style.background='var(--accent)'; badge.style.color='#000';
    badge.style.borderRadius='50%'; badge.style.width='20px'; badge.style.height='20px';
    badge.style.display='flex'; badge.style.alignItems='center'; badge.style.justifyContent='center';
    badge.style.fontSize='10px'; badge.style.fontWeight='900';
    badge.textContent = ac.duration === null ? '∞' : ac.duration;
    el.appendChild(badge);
    grid.appendChild(el);
  });
}

// Start
loadCards();
updateHUD();
</script>
</body>
</html>
