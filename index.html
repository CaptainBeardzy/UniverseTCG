<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>WWE Chaos Packs – Testing Branch</title>
<style>
:root {
  --bg-deep: #05050a;
  --bg-panel: #12121e;
  --accent: #e8c84a;
  --text-dim: #9494b8;
  --face: #4a8af4;
  --heel: #f44a4a;
  --promo: #a888ff;
  --glass: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.1);
  --expire-red: #ff4d4d;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body { 
  background: var(--bg-deep); color:#fff; 
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
  height: 100vh; width: 100vw; overflow: hidden;
}

/* --- HUD --- */
#hud {
  position: fixed; top: 0; left: 0; right: 0; height: 70px;
  background: rgba(10, 10, 20, 0.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; justify-content: space-between; z-index: 1100;
}
.resource-group { display: flex; gap: 6px; }
.pill {
  background: var(--glass); border: 1px solid var(--border); border-radius: 10px;
  padding: 4px 8px; display: flex; flex-direction: column; align-items: center; min-width: 65px;
}
.pill .label { font-size: 7px; text-transform: uppercase; color: var(--text-dim); font-weight: 800; }
.pill .val { font-size: 14px; font-weight: 800; }
.pill.heat .val { color: var(--heel); }
.pill.hype .val { color: #fa0; }
.pill.clout .val { color: var(--promo); }

.stats-group { text-align: right; }
.show-tag { color: var(--accent); font-weight: 900; font-size: 11px; letter-spacing: 1px; }
.pack-count { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

/* --- NAVIGATION --- */
#nav-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
  background: var(--bg-panel); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center; z-index: 1100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; color: var(--text-dim);
  background: none; border: none; font-size: 10px; font-weight: 600; cursor: pointer;
}
.nav-item.active { color: var(--accent); }
.nav-item .icon { font-size: 20px; margin-bottom: 2px; }

/* --- VIEWPORTS --- */
#app-viewport { position: absolute; top: 70px; bottom: 65px; left: 0; right: 0; overflow-y: auto; padding: 16px; }
.view-section { display: none; width: 100%; max-width: 800px; margin: 0 auto; }
.view-section.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* --- CARD DESIGN 3.0 --- */
.card { width: 110px; height: 180px; perspective: 1000px; position: relative; }
@media (min-width: 600px) { .card { width: 150px; height: 240px; } }

.card-inner { 
  width: 100%; height: 100%; position: relative; 
  transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}
.card.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back { 
  position: absolute; inset: 0; backface-visibility: hidden; 
  border-radius: 12px; border: 1px solid var(--border); overflow: hidden;
}
.card-front { background: radial-gradient(circle, #222, #000); display: flex; align-items: center; justify-content: center; font-size: 30px; }

.card-back { transform: rotateY(180deg); background: #0f0f15; display: flex; flex-direction: column; padding: 10px; }
.card-back.heel { border-top: 5px solid var(--heel); }
.card-back.face { border-top: 5px solid var(--face); }
.card-back.promo { border-top: 5px solid var(--promo); }

.card-type-label { font-size: 8px; font-weight: 900; opacity: 0.7; margin-bottom: 4px; }
.card-title { font-size: 12px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.card-desc { font-size: 9px; color: var(--text-dim); flex-grow: 1; line-height: 1.3; }

/* Dynamic Cost/Grant Display */
.card-footer { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--glass); }
.resource-line { display: flex; gap: 4px; flex-wrap: wrap; font-size: 9px; font-weight: 700; align-items: center; }
.res-tag { 
  padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.3);
  display: flex; align-items: center; gap: 3px;
}
.res-tag.plus { color: #4f4; border: 1px solid rgba(0,255,0,0.2); }
.res-tag.minus { color: var(--heel); border: 1px solid rgba(255,0,0,0.2); }

/* --- TOAST ALERTS --- */
#toast-container {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  z-index: 3000; width: 90%; max-width: 400px; pointer-events: none;
}
.toast {
  background: #1a1a2e; border-left: 4px solid var(--accent); border-radius: 8px;
  padding: 12px 16px; margin-top: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: flex; align-items: center; gap: 10px; animation: slideUp 0.3s ease;
}
.toast.error { border-left-color: var(--expire-red); }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* --- MISC --- */
.btn-primary {
  width: 100%; background: var(--accent); color: #000; border: none;
  padding: 12px; border-radius: 12px; font-weight: 900; text-transform: uppercase;
  cursor: pointer; transition: 0.2s;
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { background: #334; color: #667; }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000;
  display: none; flex-direction: column;
}
.overlay.active { display: flex; }

.pack-card {
  background: linear-gradient(135deg, #1a1a2e, #0a0a1a);
  border: 1px solid var(--border); border-radius: 16px; padding: 20px;
  text-align: center; cursor: pointer; transition: 0.2s;
}
.pack-card:hover { border-color: var(--accent); }

#cards-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 30px 0; }

.use-window { font-size: 8px; background: rgba(0,0,0,0.4); padding: 2px 4px; border-radius: 4px; align-self: flex-start; margin-top: 4px; }

/* --- OVERLAY CLOSE BUTTON --- */
.close-overlay-btn {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,0.1); border: 1px solid var(--border);
  color: #fff; padding: 10px 20px; border-radius: 30px;
  font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
  z-index: 2100;
}
.close-overlay-btn:hover { background: rgba(255,255,255,0.2); }

/* --- ANIMATIONS --- */
@keyframes pulseRed {
  0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
}
.expire-pulse { animation: pulseRed 0.6s ease; }

@keyframes tickFlash {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}
.tick-flash { animation: tickFlash 0.4s ease; }

@keyframes discardSlide {
  to { opacity: 0; transform: translateY(20px); }
}
.discard-animation { animation: discardSlide 0.5s forwards; }
</style>
</head>
<body>

<div id="toast-container"></div>

<header id="hud">
  <div class="resource-group">
    <div class="pill heat"><span class="label">Heat</span><span class="val" id="res-heat">0</span></div>
    <div class="pill hype"><span class="label">Hype</span><span class="val" id="res-hype">0</span></div>
    <div class="pill clout"><span class="label">Clout</span><span class="val" id="res-clout">0</span></div>
  </div>
  <div class="stats-group">
    <div class="show-tag" id="show-tag">MONDAY NIGHT CHAOS</div>
    <div class="pack-count">📦 <span id="packs-count">1</span> Available</div>
  </div>
</header>

<main id="app-viewport">
  <section id="view-packs" class="view-section active">
    <h3 style="text-align:center; margin-bottom:15px; letter-spacing:1px;">GET NEW TALENT</h3>
    <div id="pack-list" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"></div>
  </section>

  <section id="view-reveal" class="view-section">
    <h2 style="text-align:center; color:var(--accent); font-size:16px;">UNBOXING...</h2>
    <div id="cards-row"></div>
    <button id="add-to-hand-btn" class="btn-primary" style="display:none" onclick="addCardsToHand()">Continue</button>
  </section>

  <section id="view-transition" class="view-section" style="text-align:center; padding-top:60px;">
    <div style="font-size:40px; margin-bottom:20px;">🎬</div>
    <h2 id="trans-title" style="color:var(--accent);">Preparing Results...</h2>
    <p id="trans-msg" style="color:var(--text-dim); font-size:12px;"></p>
    <div id="transition-cards-area" style="display:flex; gap:8px; overflow-x:auto; padding:20px 0; justify-content:center;"></div>
    <button id="finish-trans-btn" class="btn-primary" style="display:none; max-width:200px; margin:20px auto;" onclick="finishTransition()">Start Next Week</button>
  </section>
</main>

<nav id="nav-bar">
  <button class="nav-item active" onclick="switchView('view-packs', this)">
    <span class="icon">🎟️</span><span>Store</span>
  </button>
  <button class="nav-item" onclick="showOverlay('hand-overlay')">
    <span class="icon">🃏</span><span>Hand (<span id="hand-badge">0</span>)</span>
  </button>
  <button class="nav-item" onclick="showOverlay('active-overlay')">
    <span class="icon">🟢</span><span>Active (<span id="active-badge">0</span>)</span>
  </button>
  <button class="nav-item" onclick="goToNextShow()">
    <span class="icon">⏳</span><span>End Week</span>
  </button>
</nav>

<!-- HAND OVERLAY -->
<div id="hand-overlay" class="overlay">
  <div style="padding:20px;">
    <h3>BACKSTAGE HAND <span id="hand-slots" style="font-size:12px; color:var(--text-dim)"></span></h3>
    <div id="hand-grid" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; overflow-y:auto; padding:10px 0 100px;"></div>
  </div>
  <button class="close-overlay-btn" onclick="hideOverlay('hand-overlay')">
    <span>⌄</span> Put Away
  </button>
  <div id="hand-actions" style="position:fixed; bottom:80px; left:20px; right:20px; background:var(--bg-panel); padding:15px; display:none; gap:10px; border-radius:12px; border:1px solid var(--border);">
    <button id="play-btn" class="btn-primary" style="flex:1" onclick="playSelectedCard()">Play Card</button>
    <button id="discard-btn" class="btn-primary" style="flex:1; background:var(--heel)" onclick="discardSelectedCard()">Discard</button>
  </div>
</div>

<!-- ACTIVE OVERLAY -->
<div id="active-overlay" class="overlay">
  <div style="padding:20px;">
    <h3>ACTIVE SHOW EFFECTS</h3>
    <div id="active-grid" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; overflow-y:auto; padding:10px 0 100px;"></div>
  </div>
  <button class="close-overlay-btn" onclick="hideOverlay('active-overlay')">
    <span>⌄</span> Close Effects
  </button>
</div>

<script>
let cardData = [];
let resources = { heat: 5, hype: 5, clout: 5 };
let packs = 1;
let showNumber = 1;
let hand = []; 
let activeCards = [];
let drawnCards = [];
let flippedCount = 0;
let promoResolved = 0;
let selectedHandItem = null;
const HAND_LIMIT = 5;

// --- UTILS & ELEMENTS ---
function updateHUD() {
  ['heat','hype','clout'].forEach(r=>document.getElementById(`res-${r}`).textContent=resources[r]);
  document.getElementById('packs-count').textContent = packs;
  document.getElementById('show-tag').textContent = `WEEK ${showNumber} – RAW`;
  document.getElementById('hand-badge').textContent = hand.length;
  document.getElementById('active-badge').textContent = activeCards.length;
}

function toast(msg, isError=false) {
  const container = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${isError ? 'error' : ''}`;
  t.innerHTML = `<span>${isError?'⚠️':'🔔'}</span> ${msg}`;
  container.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

// --- LOADER ---
async function init() {
  try {
    const res = await fetch('packs.json');
    const index = await res.json();
    const packPromises = index.packs.map(p => fetch(p).then(r => r.json()));
    cardData = await Promise.all(packPromises);
    renderStore();
  } catch (e) { toast("Critical: Packs failed to load", true); }
}

function renderStore() {
  const list = document.getElementById('pack-list');
  list.innerHTML = '';
  cardData.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'pack-card';
    card.innerHTML = `<div style="font-size:30px;">${p.icon||'📦'}</div><div style="margin-top:10px; font-weight:800; font-size:12px;">${p.name.toUpperCase()}</div>`;
    card.onclick = () => openPack(i);
    list.appendChild(card);
  });
}

// --- PACK OPENING ---
function openPack(idx) {
  if (packs <= 0) return toast("No packs available. Proceed to next week.", true);
  if (hand.some(h => h.card.cardType === 'heel' && (h.card.use === 'Immediately' || h.card.use === 'Immediate'))) {
    return toast("Must resolve immediate Heel cards first!", true);
  }

  packs--;
  const pack = cardData[idx];
  drawnCards = drawCards(pack);
  flippedCount = 0; promoResolved = 0;
  
  const row = document.getElementById('cards-row');
  row.innerHTML = '';
  drawnCards.forEach(c => {
    const el = createCardUI(c);
    el.onclick = () => flip(el, c);
    row.appendChild(el);
  });
  
  switchView('view-reveal');
  updateHUD();
}

function drawCards(pack) {
  const pull = type => {
    const pool = pack.cards.filter(c=>c.cardType===type);
    return pool[Math.floor(Math.random()*pool.length)];
  };
  return [pull('heel'), pull('face'), pull('promo')].sort(()=>Math.random()-0.5);
}

function flip(el, card) {
  if (el.classList.contains('flipped')) return;
  el.classList.add('flipped');
  flippedCount++;

  if (card.cardType === 'promo') {
    const btn = document.createElement('div');
    btn.innerHTML = `<button class="btn-primary" style="margin-top:10px; font-size:10px; padding:8px;">Claim Resources</button>`;
    btn.onclick = (e) => {
      e.stopPropagation();
      Object.entries(card.grants||{}).forEach(([r,v]) => {
        resources[r] += v;
        toast(`+${v} ${r.charAt(0).toUpperCase()+r.slice(1)}`);
      });
      promoResolved++;
      el.style.opacity = '0.3';
      btn.remove();
      checkRevealDone();
      updateHUD();
    };
    el.appendChild(btn);
  } else {
    checkRevealDone();
  }
}

function checkRevealDone() {
  const promos = drawnCards.filter(c=>c.cardType==='promo').length;
  if (flippedCount >= 3 && promoResolved >= promos) {
    document.getElementById('add-to-hand-btn').style.display = 'block';
  }
}

function addCardsToHand() {
  drawnCards.forEach(c => {
    if(c.cardType !== 'promo') {
      hand.push({ 
        card: c, 
        useWindow: c.use?.includes('within') ? parseInt(c.use.match(/\d+/)[0]) : null 
      });
    }
  });
  drawnCards = [];
  document.getElementById('add-to-hand-btn').style.display = 'none';
  switchView('view-packs');
  updateHUD();
}

// --- OVERLAYS & ACTIONS ---
function showOverlay(id) {
  document.getElementById(id).classList.add('active');
  if(id === 'hand-overlay') renderHand();
  if(id === 'active-overlay') renderActive();
}
function hideOverlay(id) { document.getElementById(id).classList.remove('active'); }

function renderHand() {
  const grid = document.getElementById('hand-grid');
  grid.innerHTML = '';
  selectedHandItem = null;
  document.getElementById('hand-actions').style.display = 'none';

  const countOccupied = hand.filter(h => !(h.card.cardType==='heel' && h.card.use.includes('Immed'))).length;
  document.getElementById('hand-slots').textContent = `(${countOccupied}/${HAND_LIMIT} Slots)`;

  hand.forEach(h => {
    const el = createCardUI(h.card);
    el.classList.add('flipped');
    if (h.useWindow !== null) {
      const w = document.createElement('div'); w.className = 'use-window';
      w.textContent = `Expires in ${h.useWindow}w`;
      el.querySelector('.card-back').appendChild(w);
    }
    el.onclick = () => {
      document.querySelectorAll('#hand-grid .card').forEach(c => c.style.borderColor = 'var(--border)');
      el.style.borderColor = varColor(h.card.cardType);
      selectedHandItem = h;
      document.getElementById('hand-actions').style.display = 'flex';
      document.getElementById('play-btn').disabled = !canAfford(h.card);
    };
    grid.appendChild(el);
  });
}

function playSelectedCard() {
  const h = selectedHandItem;
  if (!canAfford(h.card)) return toast("Insufficient resources!", true);
  
  Object.entries(h.card.cost||{}).forEach(([r,v]) => resources[r] -= v);
  
  const durStr = h.card.duration;
  let dur = durStr === 'Permanent' ? null : (parseInt(durStr) || 0);
  
  if (dur !== 0 || durStr === 'Permanent') {
    activeCards.push({ card: h.card, duration: dur });
    toast(`${h.card.title} is now Active!`);
  } else {
    toast(`Played ${h.card.title}`);
  }

  hand = hand.filter(i=>i!==h);
  updateHUD();
  renderHand();
}

function discardSelectedCard() {
  hand = hand.filter(i=>i!==selectedHandItem);
  renderHand();
  updateHUD();
}

function renderActive() {
  const grid = document.getElementById('active-grid');
  grid.innerHTML = '';
  activeCards.forEach(ac => {
    const el = createCardUI(ac.card);
    el.classList.add('flipped');
    const badge = document.createElement('div');
    badge.style = "position:absolute; bottom:5px; right:5px; background:var(--accent); color:#000; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900;";
    badge.textContent = ac.duration === null ? '∞' : ac.duration;
    el.appendChild(badge);
    grid.appendChild(el);
  });
}

// --- CARD BUILDER ---
function createCardUI(card) {
  const el = document.createElement('div');
  el.className = 'card';
  
  let resourceHTML = '';
  if (card.cardType === 'promo') {
    resourceHTML = Object.entries(card.grants||{}).map(([r,v]) => `<span class="res-tag plus">+${v} ${r.charAt(0).toUpperCase()+r.slice(1)}</span>`).join('');
  } else {
    resourceHTML = Object.entries(card.cost||{}).map(([r,v]) => `<span class="res-tag minus">-${v} ${r.charAt(0).toUpperCase()+r.slice(1)}</span>`).join('');
  }

  el.innerHTML = `
    <div class="card-inner">
      <div class="card-front">?</div>
      <div class="card-back ${card.cardType}">
        <div class="card-type-label">${card.cardType.toUpperCase()}</div>
        <div class="card-title">${card.title}</div>
        <div class="card-desc">${card.desc}</div>
        <div class="card-footer">
          <div class="resource-line">${resourceHTML || '<span style="opacity:0.4">FREE</span>'}</div>
        </div>
      </div>
    </div>`;
  return el;
}

// --- STATE HELPERS ---
function canAfford(c) { return Object.entries(c.cost||{}).every(([r,v])=>resources[r]>=v); }
function varColor(t) { return t==='heel'?'var(--heel)':(t==='face'?'var(--face)':'var(--promo)'); }
function switchView(id, btn) {
  document.querySelectorAll('.view-section').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(btn) btn.classList.add('active');
}

// --- TRANSITION WITH ANIMATIONS ---
async function goToNextShow() {
  const size = hand.filter(h => !(h.card.cardType==='heel' && h.card.use.includes('Immed'))).length;
  if(size > HAND_LIMIT) return toast("Hand is full! Discard to end week.", true);
  if(hand.some(h=>h.card.cardType==='heel' && h.card.use.includes('Immed'))) return toast("Forced Heels remain!", true);

  switchView('view-transition');
  document.getElementById('trans-msg').textContent = "Updating durations and weekly momentum...";
  
  await new Promise(r=>setTimeout(r, 1200));

  // --- ACTIVE CARD ANIMATION ---
  const activeGrid = document.getElementById('transition-cards-area');
  activeGrid.innerHTML = '';
  const promises = [];

  activeCards.forEach((ac, i) => {
    const el = createCardUI(ac.card);
    el.classList.add('flipped');
    activeGrid.appendChild(el);

    if (ac.duration !== null) {
      ac.duration--;
      if (ac.duration <= 0) {
        el.classList.add('expire-pulse');
        promises.push(new Promise(r => {
          setTimeout(() => {
            el.classList.add('discard-animation');
            setTimeout(() => el.remove(), 500);
            r();
          }, 600);
        }));
      } else {
        el.classList.add('tick-flash');
        setTimeout(() => el.classList.remove('tick-flash'), 400);
      }
    }
  });

  activeCards = activeCards.filter(ac => ac.duration === null || ac.duration > 0);

  // --- HAND CARD DISCARD ANIMATION ---
  const handToRemove = [];
  hand.forEach((h, i) => {
    if(h.useWindow !== null) h.useWindow--;
    if(h.useWindow === 0 && h.card.cardType === 'face') {
      const el = document.createElement('div');
      el.style.width = '80px'; el.style.height = '120px';
      el.style.background = '#1a1a2e'; el.style.border = '1px solid var(--border)';
      el.style.borderRadius = '8px'; el.style.display = 'flex'; el.style.alignItems = 'center';
      el.style.justifyContent = 'center'; el.style.fontSize = '10px'; el.style.margin = '0 4px';
      el.textContent = h.card.title.substring(0, 10) + '...';
      activeGrid.appendChild(el);
      
      el.classList.add('discard-animation');
      handToRemove.push(h);
      promises.push(new Promise(r => setTimeout(() => { el.remove(); r(); }, 500)));
    }
    
    if(h.useWindow === 0 && h.card.cardType === 'heel') {
       h.card.use = 'Immediately';
    }
  });

  hand = hand.filter(h => !handToRemove.includes(h) && (h.useWindow === null || h.useWindow > 0 || h.card.use === 'Immediately'));

  await Promise.all(promises);
  document.getElementById('finish-trans-btn').style.display = 'block';
  document.getElementById('trans-msg').textContent = "Weekly Prep Complete. 1 New Pack Awarded.";
}

function finishTransition() {
  showNumber++; packs++;
  document.getElementById('finish-trans-btn').style.display = 'none';
  switchView('view-packs');
  updateHUD();
}

init();
updateHUD();
</script>
</body>
</html>
