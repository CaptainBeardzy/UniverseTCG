<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWE Chaos Pack Opener</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: white;
  }

  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .screen {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
  }

  /* ---- PACK SELECTION ---- */
  #pack-screen h1 {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 30px #4a90d9;
    margin-bottom: 8px;
  }

  #pack-screen p {
    color: #aaa;
    margin-bottom: 50px;
    font-size: 0.95rem;
    letter-spacing: 1px;
  }

  #loading-msg {
    color: #555;
    font-size: 0.8rem;
    letter-spacing: 2px;
    margin-top: 20px;
    animation: pulse 1.5s infinite;
  }

  .pack-container {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .pack {
    width: 160px;
    height: 220px;
    border-radius: 14px;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    border: 2px solid transparent;
    overflow: hidden;
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border-color: #4a90d9;
    box-shadow: 0 0 20px rgba(74,144,217,0.3);
  }

  .pack:hover {
    transform: translateY(-8px) scale(1.04);
    box-shadow: 0 0 40px rgba(74,144,217,0.6);
  }

  .pack-icon { font-size: 2.8rem; margin-bottom: 10px; }
  .pack-name { font-size: 0.9rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .pack-desc { font-size: 0.65rem; color: #aaa; margin-top: 6px; line-height: 1.4; }
  .pack-count { font-size: 0.6rem; margin-top: 10px; padding: 2px 10px; border-radius: 20px; font-weight: 700; letter-spacing: 1px; background: rgba(74,144,217,0.2); color: #4a90d9; }

  /* ---- OPENING ANIMATION ---- */
  #opening-screen { display: none; }

  .pack-opening-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100vh;
  }

  .pack-rip-top, .pack-rip-bottom {
    position: absolute;
    width: 180px;
    left: 0;
    border-radius: 16px;
    transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border: 2px solid #4a90d9;
    box-shadow: 0 0 40px rgba(74,144,217,0.5);
  }

  .pack-rip-top {
    top: 0;
    height: 130px;
    border-bottom: none;
    font-size: 3rem;
    align-items: flex-start;
    padding-top: 20px;
  }

  .pack-rip-bottom {
    bottom: 0;
    height: 130px;
    border-top: none;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #aaa;
    align-items: flex-end;
    padding-bottom: 18px;
  }

  .pack-rip-top.ripped { transform: translateY(-140%) rotate(-6deg); }
  .pack-rip-bottom.ripped { transform: translateY(140%) rotate(4deg); }

  .pack-wrapper {
    position: relative;
    width: 180px;
    height: 260px;
    cursor: pointer;
  }

  .click-hint {
    position: absolute;
    bottom: -44px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: #aaa;
    letter-spacing: 2px;
    white-space: nowrap;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* ---- CARDS REVEAL ---- */
  #cards-screen { display: none; }

  .cards-title {
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 30px;
  }

  .cards-reveal-area {
    display: flex;
    gap: 24px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    padding: 20px;
  }

  .card {
    width: 165px;
    height: 270px;
    border-radius: 14px;
    position: relative;
    cursor: pointer;
    perspective: 600px;
    opacity: 0;
    transform: translateY(60px) scale(0.8);
    transition: opacity 0.5s, transform 0.5s;
  }

  .card.revealed {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 14px;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-back, .card-front {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    text-align: center;
  }

  .card-back {
    background: linear-gradient(145deg, #111, #1a1a2e);
    border: 2px solid #2a2a4a;
    font-size: 2.5rem;
  }

  .card-back::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    opacity: 0.5;
  }

  .card-front {
    transform: rotateY(180deg);
  }

  .rarity-common .card-front {
    background: linear-gradient(145deg, #1a1a2e, #252540);
    border: 2px solid #4a90d9;
    box-shadow: 0 0 15px rgba(74,144,217,0.3);
  }

  .rarity-rare .card-front {
    background: linear-gradient(145deg, #0d2a0d, #1a3d1a);
    border: 2px solid #4aff6e;
    box-shadow: 0 0 20px rgba(74,255,110,0.4);
  }

  .rarity-epic .card-front {
    background: linear-gradient(145deg, #1a0030, #2d0050);
    border: 2px solid #c84aff;
    box-shadow: 0 0 25px rgba(200,74,255,0.5);
  }

  .rarity-legendary .card-front {
    background: linear-gradient(145deg, #2a1500, #3d2000);
    border: 2px solid #ff9a00;
    box-shadow: 0 0 30px rgba(255,154,0,0.6), 0 0 60px rgba(255,154,0,0.2);
  }

  .rarity-legendary .card-front::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: linear-gradient(105deg, transparent 40%, rgba(255,200,50,0.15) 50%, transparent 60%);
    animation: shimmer 2.5s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }

  .card-type { font-size: 0.52rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.65; margin-bottom: 4px; }
  .card-title { font-size: 0.82rem; font-weight: 800; letter-spacing: 0.5px; line-height: 1.2; margin-bottom: 8px; }
  .card-desc { font-size: 0.56rem; color: #ccc; line-height: 1.45; margin-bottom: 8px; }
  .card-meta {
    position: absolute;
    bottom: 30px;
    left: 0; right: 0;
    padding: 0 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
  }
  .card-meta-row {
    font-size: 0.48rem;
    letter-spacing: 0.8px;
    color: #999;
  }
  .card-meta-row span {
    font-weight: 700;
    color: #ddd;
  }
  .energy-positive { color: #4aff6e !important; }
  .energy-negative { color: #ff6b6b !important; }
  .energy-zero { color: #aaa !important; }
  .card-rarity-badge {
    position: absolute;
    bottom: 10px;
    font-size: 0.52rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .rarity-common .card-rarity-badge { background: rgba(74,144,217,0.2); color: #4a90d9; }
  .rarity-rare .card-rarity-badge { background: rgba(74,255,110,0.2); color: #4aff6e; }
  .rarity-epic .card-rarity-badge { background: rgba(200,74,255,0.2); color: #c84aff; }
  .rarity-legendary .card-rarity-badge { background: rgba(255,154,0,0.2); color: #ff9a00; }

  .card:not(.flipped):hover { transform: translateY(-4px) scale(1.02); }

  .flip-hint {
    font-size: 0.65rem;
    color: #555;
    letter-spacing: 2px;
    margin-top: 16px;
    animation: pulse 2s infinite;
  }

  .btn {
    margin-top: 30px;
    padding: 14px 36px;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    background: linear-gradient(135deg, #4a90d9, #2a60a9);
    color: #fff;
    box-shadow: 0 4px 20px rgba(74,144,217,0.4);
  }

  .btn:hover { transform: scale(1.05); }

  #flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.1s;
  }

  .glow-burst {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    background: radial-gradient(circle at center, rgba(255,154,0,0.35) 0%, transparent 70%);
    transition: opacity 0.3s;
  }
  .glow-burst.active { opacity: 1; }

  #error-msg {
    color: #ff6b6b;
    font-size: 0.8rem;
    margin-top: 20px;
    text-align: center;
    max-width: 400px;
    line-height: 1.5;
    display: none;
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div id="flash"></div>
<div class="glow-burst" id="glowBurst"></div>

<!-- PACK SELECTION -->
<div class="screen" id="pack-screen">
  <h1>⚡ Chaos Packs</h1>
  <p>WWE Universe Mode — Season 1</p>
  <div class="pack-container" id="packContainer"></div>
  <div id="loading-msg">LOADING CARDS...</div>
  <div id="error-msg"></div>
</div>

<!-- OPENING ANIMATION -->
<div class="screen" id="opening-screen">
  <div class="pack-opening-wrap">
    <div style="position:relative; display:flex; flex-direction:column; align-items:center;">
      <div class="pack-wrapper" id="packWrapper" onclick="ripPack()">
        <div class="pack-rip-top" id="ripTop">📦</div>
        <div class="pack-rip-bottom" id="ripBottom">WWE Chaos</div>
      </div>
      <div class="click-hint" id="clickHint">CLICK TO OPEN</div>
    </div>
  </div>
</div>

<!-- CARDS REVEAL -->
<div class="screen" id="cards-screen">
  <div class="cards-title">Your Cards</div>
  <div class="cards-reveal-area" id="cardsArea"></div>
  <div class="flip-hint" id="flipHint">CLICK CARDS TO REVEAL</div>
  <button class="btn" id="openAgainBtn" onclick="resetToPackScreen()" style="display:none;">Open Another Pack</button>
</div>

<script>
// ---- PARTICLES ----
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];
for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.3,
    dx: (Math.random() - 0.5) * 0.3,
    dy: -Math.random() * 0.4 - 0.1,
    alpha: Math.random() * 0.5 + 0.1,
    color: ['#4a90d9','#e8c84a','#c84aff','#4aff6e'][Math.floor(Math.random()*4)]
  });
}

function animParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.fill();
    p.x += p.dx;
    p.y += p.dy;
    if (p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(animParticles);
}
animParticles();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// ---- CARD DATA ----
let cardData = null;
let currentPackKey = null;
let drawnCards = [];
let flippedCount = 0;
let packRipped = false;

// Weighted random draw based on rarityWeights
function weightedDraw(cards, weights) {
  const pool = [];
  cards.forEach(card => {
    const w = weights[card.rarity] || 10;
    for (let i = 0; i < w; i++) pool.push(card);
  });
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  // Pick 3 unique cards
  const picked = [];
  const seen = new Set();
  for (const card of shuffled) {
    if (!seen.has(card.title)) {
      seen.add(card.title);
      picked.push(card);
      if (picked.length === 3) break;
    }
  }
  return picked;
}

function buildPackUI(packs) {
  const container = document.getElementById('packContainer');
  const loadingMsg = document.getElementById('loading-msg');
  container.innerHTML = '';
  loadingMsg.style.display = 'none';

  packs.forEach((pack, index) => {
    const el = document.createElement('div');
    el.className = 'pack';
    el.innerHTML = `
      <div class="pack-icon">${pack.icon}</div>
      <div class="pack-name">${pack.name}</div>
      <div class="pack-desc">${pack.desc}</div>
      <div class="pack-count">${pack.cards.length} cards</div>
    `;
    el.onclick = () => selectPack(index);
    container.appendChild(el);
  });
}

// Load packs.json manifest, then fetch each individual pack file
async function loadCards() {
  try {
    const manifestRes = await fetch('packs.json');
    if (!manifestRes.ok) throw new Error('packs.json not found');
    const manifest = await manifestRes.json();

    // Fetch all pack files listed in the manifest
    const packFiles = await Promise.all(
      manifest.packs.map(path => fetch(path).then(r => {
        if (!r.ok) throw new Error(`Could not load ${path}`);
        return r.json();
      }))
    );

    cardData = {
      packs: packFiles,
      rarityWeights: manifest.rarityWeights
    };
    buildPackUI(cardData.packs);
  } catch (e) {
    const loadingMsg = document.getElementById('loading-msg');
    const errorMsg = document.getElementById('error-msg');
    loadingMsg.style.display = 'none';
    errorMsg.style.display = 'block';
    errorMsg.textContent = 'Could not load packs. Make sure packs.json and your pack files are in the correct location and you are running this from a local server.';
  }
}

// ---- PACK FLOW ----
function selectPack(key) {
  currentPackKey = key;
  const pack = cardData.packs[key]; // key is array index
  drawnCards = weightedDraw(pack.cards, cardData.rarityWeights);

  document.getElementById('ripTop').textContent = pack.icon;
  document.getElementById('ripBottom').textContent = pack.name;
  document.getElementById('ripTop').className = 'pack-rip-top';
  document.getElementById('ripBottom').className = 'pack-rip-bottom';

  document.getElementById('pack-screen').style.display = 'none';
  document.getElementById('opening-screen').style.display = 'flex';
  document.getElementById('clickHint').style.display = 'block';
  packRipped = false;
}

function ripPack() {
  if (packRipped) return;
  packRipped = true;
  document.getElementById('clickHint').style.display = 'none';

  setTimeout(() => {
    document.getElementById('ripTop').classList.add('ripped');
    document.getElementById('ripBottom').classList.add('ripped');

    const flash = document.getElementById('flash');
    flash.style.opacity = '0.7';
    setTimeout(() => { flash.style.opacity = '0'; }, 150);

    setTimeout(showCards, 700);
  }, 150);
}

function showCards() {
  document.getElementById('opening-screen').style.display = 'none';
  document.getElementById('cards-screen').style.display = 'flex';
  document.getElementById('openAgainBtn').style.display = 'none';
  document.getElementById('flipHint').style.display = 'block';

  const area = document.getElementById('cardsArea');
  area.innerHTML = '';
  flippedCount = 0;

  drawnCards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = `card rarity-${card.rarity}`;
    const energyVal = card.energy;
    const energyClass = energyVal > 0 ? 'energy-positive' : energyVal < 0 ? 'energy-negative' : 'energy-zero';
    const energyLabel = energyVal > 0 ? `+${energyVal}` : `${energyVal}`;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-back">🎴</div>
        <div class="card-front">
          <div class="card-type">${card.type}</div>
          <div class="card-title">${card.title}</div>
          <div class="card-desc">${card.desc}</div>
          <div class="card-meta">
            <div class="card-meta-row">Energy: <span class="${energyClass}">${energyLabel}</span></div>
            <div class="card-meta-row">Duration: <span>${card.duration}</span></div>
            <div class="card-meta-row">Use: <span>${card.use}</span></div>
          </div>
          <div class="card-rarity-badge">${card.rarity}</div>
        </div>
      </div>
    `;
    el.onclick = () => flipCard(el, card);
    area.appendChild(el);

    setTimeout(() => el.classList.add('revealed'), i * 220 + 100);
  });
}

function flipCard(el, card) {
  if (el.classList.contains('flipped')) return;
  el.classList.add('flipped');
  flippedCount++;

  if (card.rarity === 'legendary') {
    const burst = document.getElementById('glowBurst');
    burst.classList.add('active');
    setTimeout(() => burst.classList.remove('active'), 900);

    const flash = document.getElementById('flash');
    flash.style.background = 'rgba(255,154,0,0.4)';
    flash.style.opacity = '0.5';
    setTimeout(() => { flash.style.opacity = '0'; flash.style.background = 'white'; }, 200);
  }

  if (flippedCount === drawnCards.length) {
    setTimeout(() => {
      document.getElementById('flipHint').style.display = 'none';
      document.getElementById('openAgainBtn').style.display = 'inline-block';
    }, 600);
  }
}

function resetToPackScreen() {
  document.getElementById('cards-screen').style.display = 'none';
  document.getElementById('pack-screen').style.display = 'flex';
}

// ---- INIT ----
loadCards();
</script>
</body>
</html>
